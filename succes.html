<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CyberQuiz — Mes succès</title>
<meta name="description" content="Les succès CyberQuiz : badges à débloquer en terminant des quiz de cybersécurité.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Share+Tech+Mono&display=swap">
<style>
:root {
  --bg: #0a0f24;
  --card: #111833;
  --accent: #00bfff;
  --accent2: #4cc9f0;
  --danger: #ff6b6b;
  --warn: #f7a81b;
  --success: #7efc6a;
  --border: rgba(0,191,255,0.18);
  --muted: rgba(255,255,255,0.6);
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  font-family: 'Poppins', sans-serif; color: #fff;
  background: radial-gradient(ellipse at top, #12204a 0%, var(--bg) 60%) fixed, var(--bg);
}
a { color: var(--accent2); }

/* ─── Navbar (même style que l'accueil) ─── */
.navbar {
  position: sticky; top: 0; z-index: 10; height: 62px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; background: rgba(10,15,36,0.88); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.nav-logo {
  font-family: 'Share Tech Mono', monospace; font-size: 1.35rem; color: var(--accent);
  letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,191,255,0.5); text-decoration: none;
}
.nav-logo span { color: #fff; }
.nav-back {
  color: rgba(255,255,255,0.75); text-decoration: none; font-size: .88rem;
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
}
.nav-back:hover { color: var(--accent); background: rgba(0,191,255,0.06); }

main { max-width: 980px; margin: 0 auto; padding: 40px 20px 60px; }

/* ─── En-tête ─── */
.hero { text-align: center; margin-bottom: 34px; }
.hero-eyebrow { font-family: 'Share Tech Mono', monospace; color: var(--success); letter-spacing: .15em; font-size: .8rem; text-transform: uppercase; }
h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 8px 0 6px; }
.hero p { color: var(--muted); margin: 0; }

.summary {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;
  margin: 28px 0 10px;
}
.summary-item {
  background: rgba(17,24,51,.75); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px; text-align: center;
}
.summary-num { display: block; font-family: 'Share Tech Mono', monospace; font-size: 1.6rem; color: var(--accent); }
.summary-label { font-size: .78rem; color: var(--muted); }

.global-track { height: 8px; background: rgba(255,255,255,.07); border-radius: 99px; overflow: hidden; margin-top: 14px; }
.global-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--success)); border-radius: 99px; transition: width 1s ease; }

/* ─── Catégories ─── */
.cat-title {
  display: flex; align-items: center; gap: 12px; margin: 34px 0 14px;
  font-family: 'Share Tech Mono', monospace; color: var(--accent2); font-size: .95rem; letter-spacing: .08em; text-transform: uppercase;
}
.cat-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.cat-count { color: var(--muted); font-size: .8rem; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }

.achv {
  position: relative; display: flex; gap: 14px; align-items: flex-start;
  padding: 16px; border-radius: 14px; background: rgba(17,24,51,.8);
  border: 1px solid rgba(255,255,255,.08); transition: transform .2s, border-color .2s;
}
.achv.unlocked { border-color: rgba(126,252,106,.4); box-shadow: 0 0 18px rgba(126,252,106,.08) inset; }
.achv.unlocked:hover { transform: translateY(-2px); border-color: var(--success); }
.achv-icon {
  flex-shrink: 0; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center;
  font-size: 1.7rem; background: rgba(0,191,255,.08); border: 1px solid var(--border);
}
.achv.unlocked .achv-icon { background: rgba(126,252,106,.1); border-color: rgba(126,252,106,.35); }
.achv.locked .achv-icon { filter: grayscale(1); opacity: .35; }
.achv-body { min-width: 0; flex: 1; }
.achv-title { font-weight: 700; font-size: .98rem; margin: 0 0 3px; }
.achv.locked .achv-title { color: rgba(255,255,255,.75); }
.achv-desc { font-size: .8rem; color: var(--muted); margin: 0; }
.achv-date { font-family: 'Share Tech Mono', monospace; font-size: .72rem; color: var(--success); margin-top: 8px; }
.achv-progress { margin-top: 10px; }
.achv-progress-track { height: 5px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; }
.achv-progress-fill { height: 100%; background: var(--accent); border-radius: 99px; }
.achv-progress-label { font-family: 'Share Tech Mono', monospace; font-size: .72rem; color: var(--muted); margin-top: 4px; }
.achv-lock { position: absolute; top: 12px; right: 12px; font-size: .75rem; color: rgba(255,255,255,.3); }

.tip {
  margin-top: 40px; padding: 16px 18px; border-radius: 12px; font-size: .88rem;
  background: rgba(0,191,255,.05); border: 1px solid var(--border); color: rgba(255,255,255,.8);
}
.tip a { font-weight: 600; }

footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 20px 30px; }

@media (max-width: 600px) {
  .navbar { padding: 0 16px; }
  main { padding: 28px 16px 48px; }
}
@media (prefers-reduced-motion: reduce) { .global-fill, .achv { transition: none; } }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070b17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CyberQuiz">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<script src="app.js"></script>
</head>
<body>

<nav class="navbar" aria-label="Navigation principale">
  <a href="accueil.html" class="nav-logo">Cyber<span>Quiz</span></a>
  <a href="accueil.html" class="nav-back">← Accueil</a>
</nav>

<main>
  <header class="hero">
    <div class="hero-eyebrow">// Salle des trophées</div>
    <h1>🏆 Mes succès</h1>
    <p>Termine des quiz, améliore tes scores et reviens régulièrement pour tout débloquer.</p>

    <div class="summary">
      <div class="summary-item"><span class="summary-num" id="sumUnlocked">0</span><span class="summary-label">succès débloqués</span></div>
      <div class="summary-item"><span class="summary-num" id="sumQuiz">0</span><span class="summary-label">quiz terminés</span></div>
      <div class="summary-item"><span class="summary-num" id="sumPlayed">0</span><span class="summary-label">parties jouées</span></div>
      <div class="summary-item"><span class="summary-num" id="sumStreak">0</span><span class="summary-label">meilleure série (jours)</span></div>
    </div>
    <div class="global-track" role="progressbar" aria-label="Succès débloqués" aria-valuemin="0" id="globalBar">
      <div class="global-fill" id="globalFill"></div>
    </div>
  </header>

  <div id="categories"></div>

  <p class="tip" id="tip"></p>
</main>

<footer>Tes succès sont enregistrés uniquement dans ce navigateur.</footer>

<script src="succes.js"></script>
<script>
'use strict';
(function () {
  const $ = id => document.getElementById(id);
  if (!window.CyberSucces) { $('categories').textContent = 'Le module de succès n’a pas pu être chargé.'; return; }

  const etat = CyberSucces.etat();
  const s = etat.stats;

  $('sumUnlocked').textContent = `${etat.debloques} / ${etat.total}`;
  $('sumQuiz').textContent = `${Object.keys(s.best).length} / ${CyberSucces.QUIZZES.length}`;
  $('sumPlayed').textContent = s.played;
  $('sumStreak').textContent = s.bestStreak;
  $('globalBar').setAttribute('aria-valuemax', etat.total);
  $('globalBar').setAttribute('aria-valuenow', etat.debloques);
  requestAnimationFrame(() => { $('globalFill').style.width = (etat.debloques / etat.total * 100) + '%'; });

  const dateFr = iso => new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });

  // Regroupe les succès par catégorie, dans l'ordre de la liste.
  const cats = [];
  etat.liste.forEach(a => {
    let c = cats.find(x => x.name === a.cat);
    if (!c) cats.push(c = { name: a.cat, items: [] });
    c.items.push(a);
  });

  cats.forEach(c => {
    const section = document.createElement('section');
    const title = document.createElement('h2');
    title.className = 'cat-title';
    title.textContent = c.name + ' ';
    const count = document.createElement('span');
    count.className = 'cat-count';
    count.textContent = `${c.items.filter(a => a.date).length}/${c.items.length}`;
    title.append(count);

    const grid = document.createElement('div');
    grid.className = 'grid';

    c.items.forEach(a => {
      const card = document.createElement('article');
      card.className = 'achv ' + (a.date ? 'unlocked' : 'locked');

      const icon = document.createElement('div');
      icon.className = 'achv-icon'; icon.textContent = a.icon; icon.setAttribute('aria-hidden', 'true');

      const body = document.createElement('div'); body.className = 'achv-body';
      const h = document.createElement('h3'); h.className = 'achv-title'; h.textContent = a.title;
      const p = document.createElement('p'); p.className = 'achv-desc'; p.textContent = a.desc;
      body.append(h, p);

      if (a.date) {
        const d = document.createElement('div'); d.className = 'achv-date';
        d.textContent = '✓ Débloqué le ' + dateFr(a.date);
        body.append(d);
      } else {
        const lock = document.createElement('span');
        lock.className = 'achv-lock'; lock.innerHTML = '<i class="fa-solid fa-lock"></i>';
        lock.setAttribute('aria-label', 'Verrouillé');
        card.append(lock);
        if (a.progress) {
          const [cur, goal] = a.progress;
          const wrap = document.createElement('div'); wrap.className = 'achv-progress';
          const track = document.createElement('div'); track.className = 'achv-progress-track';
          const fill = document.createElement('div'); fill.className = 'achv-progress-fill';
          fill.style.width = (cur / goal * 100) + '%';
          track.append(fill);
          const label = document.createElement('div'); label.className = 'achv-progress-label';
          label.textContent = `${cur} / ${goal}`;
          wrap.append(track, label);
          body.append(wrap);
        }
      }
      card.prepend(icon);
      card.append(body);
      grid.append(card);
    });

    section.append(title, grid);
    $('categories').append(section);
  });

  // Conseil personnalisé : le prochain quiz pas encore terminé.
  const next = CyberSucces.QUIZZES.find(q => !(q.key in s.best));
  const tip = $('tip');
  if (etat.debloques === etat.total) {
    tip.textContent = '🛡️ Bravo, tu as débloqué tous les succès ! Refais les quiz de temps en temps pour garder les bons réflexes.';
  } else if (next) {
    tip.append('💡 Prochain objectif : ');
    const link = document.createElement('a'); link.href = next.key + '.html'; link.textContent = next.title;
    tip.append(link, ' — chaque nouveau quiz terminé te rapproche de plusieurs succès.');
  } else {
    tip.textContent = '💡 Tous les quiz sont terminés : vise les 100 % et reviens plusieurs jours de suite pour débloquer les derniers succès.';
  }
})();
</script>
<script src="audio.js" defer></script>
<script src="pwa.js" defer></script>
</body>
</html>
